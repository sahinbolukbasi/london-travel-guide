<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dünya Gezi Rehberi - Dünyanın en güzel şehirlerini interaktif 3D harita ile keşfedin">
    <meta name="keywords" content="gezi rehberi, travel guide, dünya, world, turizm, seyahat">
    <meta name="author" content="Dünya Gezi Rehberi">
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="Dünya Gezi Rehberi">
    <meta property="og:description" content="Dünyanın en güzel şehirlerini interaktif haritalarla keşfedin">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Dünya Gezi Rehberi">
    
    <title>Dünya Gezi Rehberi | World Travel Guide</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🌍</text></svg>">
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FQH4RXGTLQ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-FQH4RXGTLQ');
    </script>
    
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="world-page">

    <!-- Full-screen globe experience -->
    <div class="globe-scene" id="globeScene">
        
        <!-- Ambient particles -->
        <div class="particles" id="particles"></div>
        
        <!-- Top bar -->
        <nav class="globe-nav">
            <div class="globe-nav-logo">
                <i class="fas fa-globe-americas"></i>
                <span data-i18n="world_title">Dünya Gezi Rehberi</span>
            </div>
            <div class="globe-nav-actions" id="globeNavActions">
                <div class="lang-switcher" id="langSwitcher" style="background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2);">
                    <button data-lang="tr" class="active" style="color: white;">TR</button>
                    <button data-lang="en" style="color: white;">EN</button>
                </div>
                <button class="nav-btn" id="shareBtn" title="Paylaş" data-i18n-title="share_btn_title">
                    <i class="fas fa-share-alt"></i>
                </button>
            </div>
            <button class="burger-btn" id="burgerBtn" aria-label="Menü">
                <i class="fas fa-bars"></i>
            </button>
        </nav>

        <!-- Hero text overlay -->
        <div class="globe-hero-text" id="heroText">
            <div class="hero-eyebrow">
                <div class="eyebrow-line"></div>
                <span data-i18n="hero_eyebrow">İNTERAKTİF GEZİ REHBERİ</span>
                <div class="eyebrow-line"></div>
            </div>
            <h1>
                <span class="hero-word" style="--i:0" data-i18n="hero_word1">Dünyayı</span>
                <span class="hero-word hero-gradient" style="--i:1" data-i18n="hero_word2">Keşfedin</span>
            </h1>
            <p class="hero-sub" data-i18n="hero_sub">Küreyi döndürün, bir şehir seçin, maceraya başlayın.</p>
            <div class="scroll-hint" id="scrollHint">
                <span data-i18n="scroll_hint">Küreyi sürükleyin</span>
                <i class="fas fa-hand-pointer"></i>
            </div>
        </div>

        <!-- 3D Globe Canvas -->
        <div class="globe-container" id="globeContainer">
            <canvas id="globeCanvas"></canvas>
            <!-- City label popup -->
            <div class="city-label" id="cityLabel">
                <div class="city-label-inner">
                    <span class="city-label-flag" id="cityLabelFlag"></span>
                    <div class="city-label-text">
                        <strong id="cityLabelName"></strong>
                        <small id="cityLabelCountry"></small>
                    </div>
                    <i class="fas fa-arrow-right city-label-arrow"></i>
                </div>
            </div>
        </div>

        <!-- Bottom country selector pills -->
        <div class="globe-bottom-bar" id="bottomBar">
            <div class="bottom-bar-inner" id="countryPills">
                <!-- Rendered by JS -->
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div class="modal" id="shareModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 data-i18n="share_modal_title">Paylaş</h3>
                <button class="modal-close" id="closeModal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="share-buttons">
                    <button class="share-btn facebook" onclick="shareOn('facebook')"><i class="fab fa-facebook"></i> Facebook</button>
                    <button class="share-btn twitter" onclick="shareOn('twitter')"><i class="fab fa-x-twitter"></i> X</button>
                    <button class="share-btn whatsapp" onclick="shareOn('whatsapp')"><i class="fab fa-whatsapp"></i> WhatsApp</button>
                    <button class="share-btn linkedin" onclick="shareOn('linkedin')"><i class="fab fa-linkedin"></i> LinkedIn</button>
                </div>
                <div class="share-link">
                    <input type="text" id="shareLink" readonly>
                    <button class="btn-copy" onclick="copyLink()"><i class="fas fa-copy"></i> <span data-i18n="copy_btn">Kopyala</span></button>
                </div>
            </div>
        </div>
    </div>

    <footer class="globe-footer">
        <p><span data-i18n="footer_designed">Designed by</span> <strong>Şahin Bölükbaşı</strong></p>
    </footer>

    <script src="world-map.js"></script>
</body>
</html>
